# Wekelijkse digest: maandag 06:00 UTC = 07:00 in de winter (08:00 in de zomer).
# Geen nieuwe items = geen mail. GitHub start geplande runs soms een paar minuten later.
name: Weekdigest versturen

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch          # nooit tegelijk met een ophaalrun
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Digest versturen
        run: python -m monitor digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAILIT_API_KEY: ${{ secrets.EMAILIT_API_KEY }}
          EMAILIT_TO: ${{ secrets.EMAILIT_TO }}
