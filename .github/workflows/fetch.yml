# Haalt alle actieve bronnen op, slaat nieuwe items op en stuurt zo nodig een urgent-mail.
# Tijden zijn in UTC: 05, 11 en 17 uur UTC = 06, 12 en 18 uur in de winter (07, 13, 19 in de zomer).
name: Bronnen ophalen

on:
  schedule:
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ophalen
        run: python -m monitor fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAILIT_API_KEY: ${{ secrets.EMAILIT_API_KEY }}
          EMAILIT_TO: ${{ secrets.EMAILIT_TO }}
